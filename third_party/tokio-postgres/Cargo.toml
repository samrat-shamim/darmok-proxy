[package]
edition = "2024"
rust-version = "1.85"
name = "tokio-postgres"
version = "0.7.18"
authors = ["Steven Fackler <sfackler@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A native, asynchronous PostgreSQL client"
readme = "README.md"
keywords = [
    "database",
    "postgres",
    "postgresql",
    "sql",
    "async",
]
categories = ["database"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-postgres/rust-postgres"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
array-impls = ["postgres-types/array-impls"]
default = ["runtime"]
js = [
    "postgres-protocol/js",
    "postgres-types/js",
]
runtime = [
    "tokio/net",
    "tokio/time",
]
with-bit-vec-0_6 = ["postgres-types/with-bit-vec-0_6"]
with-bit-vec-0_7 = ["postgres-types/with-bit-vec-0_7"]
with-bit-vec-0_8 = ["postgres-types/with-bit-vec-0_8"]
with-bit-vec-0_9 = ["postgres-types/with-bit-vec-0_9"]
with-chrono-0_4 = ["postgres-types/with-chrono-0_4"]
with-cidr-0_2 = ["postgres-types/with-cidr-0_2"]
with-cidr-0_3 = ["postgres-types/with-cidr-0_3"]
with-eui48-0_4 = ["postgres-types/with-eui48-0_4"]
with-eui48-1 = ["postgres-types/with-eui48-1"]
with-geo-types-0_6 = ["postgres-types/with-geo-types-0_6"]
with-geo-types-0_7 = ["postgres-types/with-geo-types-0_7"]
with-jiff-0_1 = ["postgres-types/with-jiff-0_1"]
with-jiff-0_2 = ["postgres-types/with-jiff-0_2"]
with-serde_json-1 = ["postgres-types/with-serde_json-1"]
with-smol_str-01 = ["postgres-types/with-smol_str-01"]
with-time-0_2 = ["postgres-types/with-time-0_2"]
with-time-0_3 = ["postgres-types/with-time-0_3"]
with-uuid-0_8 = ["postgres-types/with-uuid-0_8"]
with-uuid-1 = ["postgres-types/with-uuid-1"]

[lib]
name = "tokio_postgres"
path = "src/lib.rs"
test = false

[dependencies.async-trait]
version = "0.1"

[dependencies.byteorder]
version = "1.0"

[dependencies.bytes]
version = "1.11"

[dependencies.fallible-iterator]
version = "0.2"

[dependencies.futures-channel]
version = "0.3"
features = ["sink"]

[dependencies.futures-util]
version = "0.3"
features = ["sink"]
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.parking_lot]
version = "0.12"

[dependencies.percent-encoding]
version = "2.0"

[dependencies.phf]
version = "0.13"

[dependencies.pin-project-lite]
version = "0.2.11"

[dependencies.postgres-protocol]
version = "0.6.12"

[dependencies.postgres-types]
version = "0.2.14"

[dependencies.rand]
version = "0.10.0"

[dependencies.tokio]
version = "1.27"
features = ["io-util"]

[dependencies.tokio-util]
version = "0.7"
features = ["codec"]

[dependencies.whoami]
version = "2.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.socket2]
version = "0.6"
features = ["all"]
