[workspace]
resolver = "2"
exclude = ["third_party/tokio-postgres"]
members = [
    "third_party/sqlparser",
    "third_party/sqlparser/derive",
    "crates/types",
    "crates/protocol",
    "crates/session",
    "crates/execute",
    "crates/catalog",
    "crates/cli",
    "tests/postgres",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/samrat-shamim/darmok-proxy"

[workspace.dependencies]
sqlparser = { package = "darmok-sqlparser", path = "third_party/sqlparser", features = ["visitor"] }
darmok-types = { path = "crates/types" }
darmok-protocol = { path = "crates/protocol" }
darmok-session = { path = "crates/session" }
darmok-execute = { path = "crates/execute" }
darmok-catalog = { path = "crates/catalog" }
thiserror = "2"
bytes = "1.10"
bitflags = "2.6"
byteorder = "1.5"
tokio-util = { version = "0.7", features = ["codec"] }
subtle = "2.6"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "=0.7.18", path = "third_party/tokio-postgres" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.6.7", features = ["derive"] }
