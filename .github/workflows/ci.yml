name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check repository boundaries
        run: python3 scripts/check_repository.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Vendored connector lints
        run: cargo clippy -p tokio-postgres --lib --locked -- -D warnings
      - name: Tests and doctests
        run: cargo test --workspace --exclude darmok-postgres-tests --all-features --locked
      - name: Default feature tests
        run: cargo test --workspace --exclude darmok-postgres-tests --locked
      - name: Minimal parser feature combinations
        run: |
          cargo check -p darmok-sqlparser --no-default-features --locked
          cargo check -p darmok-sqlparser --no-default-features --features std --locked
          cargo check -p darmok-sqlparser --no-default-features --features visitor --locked

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "17"
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - version: "18"
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: darmok-test
          POSTGRES_DB: darmok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d darmok_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      DARMOK_TEST_DATABASE_URL: postgres://postgres:darmok-test@localhost:5432/darmok_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Required PostgreSQL tests
        run: cargo test -p darmok-postgres-tests --locked
      - name: Required native owner database unit fixtures
        run: cargo test -p darmok-execute --lib --locked native_backend::tests -- --ignored

  mysql-reference:
    name: MySQL 8.4 reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: darmok-test
        options: >-
          --health-cmd "mysqladmin ping --silent --host=127.0.0.1"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      MYSQL_PWD: darmok-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Required stock transaction reference observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_transactions.json
          --evidence-dir '${{ runner.temp }}/mysql-transaction-reference'
      - name: Preserve reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-transaction-reference
          path: ${{ runner.temp }}/mysql-transaction-reference
          if-no-files-found: error
      - name: Required stock transaction characteristic observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_transaction_characteristics.json
          --evidence-dir '${{ runner.temp }}/mysql-transaction-characteristics'
      - name: Preserve characteristic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-transaction-characteristics
          path: ${{ runner.temp }}/mysql-transaction-characteristics
          if-no-files-found: error
      - name: Required stock SQL-mode value observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_sql_modes.json
          --evidence-dir '${{ runner.temp }}/mysql-sql-mode-values'
      - name: Preserve SQL-mode value receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-sql-mode-values
          path: ${{ runner.temp }}/mysql-sql-mode-values
          if-no-files-found: error
