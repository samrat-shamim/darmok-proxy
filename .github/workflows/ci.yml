name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check repository boundaries
        run: python3 scripts/check_repository.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Vendored connector lints
        run: cargo clippy -p tokio-postgres --lib --locked -- -D warnings
      - name: Tests and doctests
        run: cargo test --workspace --exclude darmok-postgres-tests --all-features --locked
      - name: Default feature tests
        run: cargo test --workspace --exclude darmok-postgres-tests --locked
      - name: Minimal parser feature combinations
        run: |
          cargo check -p darmok-sqlparser --no-default-features --locked
          cargo check -p darmok-sqlparser --no-default-features --features std --locked
          cargo check -p darmok-sqlparser --no-default-features --features visitor --locked

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "17"
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - version: "18"
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env:
      DARMOK_TEST_DATABASE_URL: postgres://postgres:darmok-test@localhost:5432/darmok_test
      DARMOK_TEST_NO_TWO_PHASE_DATABASE_URL: postgres://postgres:darmok-test@localhost:5433/darmok_test
      DARMOK_TEST_UNPRELOADED_DATABASE_URL: postgres://postgres:darmok-test@localhost:5434/darmok_test
      DARMOK_TEST_ORDERED_TWO_PHASE_DATABASE_URL: postgres://postgres:darmok-test@localhost:5435/darmok_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build and initialize the required server module
        run: |
          mkdir '${{ runner.temp }}/darmok-server-evidence'
          docker build --progress=plain \
            --build-arg 'POSTGRES_IMAGE=${{ matrix.image }}' \
            --tag 'darmok-server:${{ matrix.version }}' \
            postgres/darmok_server \
            >'${{ runner.temp }}/darmok-server-evidence/build.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/build.stderr'
          docker build --progress=plain \
            --build-arg 'DARMOK_PRODUCT_IMAGE=darmok-server:${{ matrix.version }}' \
            --tag 'darmok-server-test:${{ matrix.version }}' \
            tests/probes/darmok_catalog_probe \
            >'${{ runner.temp }}/darmok-server-evidence/probe-build.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/probe-build.stderr'
          docker run --detach --name darmok-server-test \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=darmok-test \
            --env POSTGRES_DB=darmok_test --publish 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d darmok_test' \
            --health-interval 1s --health-timeout 3s --health-retries 30 \
            'darmok-server-test:${{ matrix.version }}' \
            postgres -c shared_preload_libraries=darmok_server \
            -c max_prepared_transactions=10
          docker run --detach --name darmok-server-no-two-phase-test \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=darmok-test \
            --env POSTGRES_DB=darmok_test --publish 127.0.0.1:5433:5432 \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d darmok_test' \
            --health-interval 1s --health-timeout 3s --health-retries 30 \
            'darmok-server-test:${{ matrix.version }}' \
            postgres -c shared_preload_libraries=darmok_server \
            -c max_prepared_transactions=0
          docker run --detach --name darmok-server-unpreloaded-test \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=darmok-test \
            --env POSTGRES_DB=darmok_test --publish 127.0.0.1:5434:5432 \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d darmok_test' \
            --health-interval 1s --health-timeout 3s --health-retries 30 \
            'darmok-server:${{ matrix.version }}' \
            postgres -c shared_preload_libraries= -c max_prepared_transactions=10
          docker run --detach --name darmok-server-ordered-two-phase-test \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=darmok-test \
            --env POSTGRES_DB=darmok_test --publish 127.0.0.1:5435:5432 \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres -d darmok_test' \
            --health-interval 1s --health-timeout 3s --health-retries 30 \
            'darmok-server-test:${{ matrix.version }}' \
            postgres -c shared_preload_libraries=darmok_catalog_probe,darmok_server \
            -c max_prepared_transactions=10
          darmok_server_ready=false
          for darmok_attempt in {1..30}; do
            darmok_server_health=$(docker inspect --format '{{.State.Health.Status}}' darmok-server-test)
            darmok_no_two_phase_health=$(docker inspect --format '{{.State.Health.Status}}' darmok-server-no-two-phase-test)
            darmok_unpreloaded_health=$(docker inspect --format '{{.State.Health.Status}}' darmok-server-unpreloaded-test)
            darmok_ordered_two_phase_health=$(docker inspect --format '{{.State.Health.Status}}' darmok-server-ordered-two-phase-test)
            if [ "$darmok_server_health" = healthy ] && [ "$darmok_no_two_phase_health" = healthy ] && [ "$darmok_unpreloaded_health" = healthy ] && [ "$darmok_ordered_two_phase_health" = healthy ]; then
              darmok_server_ready=true
              break
            fi
            if [ "$darmok_server_health" = unhealthy ] || [ "$darmok_no_two_phase_health" = unhealthy ] || [ "$darmok_unpreloaded_health" = unhealthy ] || [ "$darmok_ordered_two_phase_health" = unhealthy ]; then
              docker logs darmok-server-test
              docker logs darmok-server-no-two-phase-test
              docker logs darmok-server-unpreloaded-test
              docker logs darmok-server-ordered-two-phase-test
              exit 1
            fi
            sleep 1
          done
          if [ "$darmok_server_ready" != true ]; then
            docker logs darmok-server-test
            docker logs darmok-server-no-two-phase-test
            docker logs darmok-server-unpreloaded-test
            docker logs darmok-server-ordered-two-phase-test
            exit 1
          fi
          docker exec darmok-server-test psql --username postgres --dbname darmok_test \
            --set ON_ERROR_STOP=1 --command 'CREATE EXTENSION darmok_server' \
            >'${{ runner.temp }}/darmok-server-evidence/install.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/install.stderr'
          docker exec darmok-server-no-two-phase-test psql --username postgres --dbname darmok_test \
            --set ON_ERROR_STOP=1 --command 'CREATE EXTENSION darmok_server' \
            >'${{ runner.temp }}/darmok-server-evidence/install-no-two-phase.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/install-no-two-phase.stderr'
          docker exec darmok-server-unpreloaded-test psql --username postgres --dbname darmok_test \
            --set ON_ERROR_STOP=1 --command 'CREATE EXTENSION darmok_server' \
            >'${{ runner.temp }}/darmok-server-evidence/install-unpreloaded.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/install-unpreloaded.stderr'
          docker exec darmok-server-ordered-two-phase-test psql --username postgres --dbname darmok_test \
            --set ON_ERROR_STOP=1 --command 'CREATE EXTENSION darmok_server' \
            >'${{ runner.temp }}/darmok-server-evidence/install-ordered-two-phase.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/install-ordered-two-phase.stderr'
      - name: Required PostgreSQL tests
        run: cargo test -p darmok-postgres-tests --locked
      - name: Preserve server build and diagnostics
        if: always()
        run: |
          docker logs darmok-server-test \
            >'${{ runner.temp }}/darmok-server-evidence/server.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/server.stderr'
          docker inspect darmok-server-test \
            >'${{ runner.temp }}/darmok-server-evidence/container.json'
          docker logs darmok-server-no-two-phase-test \
            >'${{ runner.temp }}/darmok-server-evidence/server-no-two-phase.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/server-no-two-phase.stderr'
          docker inspect darmok-server-no-two-phase-test \
            >'${{ runner.temp }}/darmok-server-evidence/container-no-two-phase.json'
          docker logs darmok-server-unpreloaded-test \
            >'${{ runner.temp }}/darmok-server-evidence/server-unpreloaded.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/server-unpreloaded.stderr'
          docker inspect darmok-server-unpreloaded-test \
            >'${{ runner.temp }}/darmok-server-evidence/container-unpreloaded.json'
          docker logs darmok-server-ordered-two-phase-test \
            >'${{ runner.temp }}/darmok-server-evidence/server-ordered-two-phase.stdout' \
            2>'${{ runner.temp }}/darmok-server-evidence/server-ordered-two-phase.stderr'
          docker inspect darmok-server-ordered-two-phase-test \
            >'${{ runner.temp }}/darmok-server-evidence/container-ordered-two-phase.json'
      - name: Upload server module evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darmok-server-pg${{ matrix.version }}
          path: ${{ runner.temp }}/darmok-server-evidence
          if-no-files-found: error
      - name: Required CLI schema process fixtures
        env:
          DARMOK_CLI_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/cli-schema-processes
        run: cargo test -p darmok-cli --test schema_process --locked -- --ignored
      - name: Preserve CLI schema process receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-schema-processes-pg${{ matrix.version }}
          path: ${{ runner.temp }}/cli-schema-processes
          if-no-files-found: error
      - name: Required native owner database unit fixtures
        run: cargo test -p darmok-execute --lib --locked native_backend::tests -- --ignored
      - name: Required BigDecimal original-source SET and transaction fixtures
        run: cargo test -p darmok-execute --lib --features sqlparser/bigdecimal --locked native_backend::tests::query_transactions -- --ignored
      - name: Required BigDecimal TCP command ownership fixtures
        run: cargo test -p darmok-execute --lib --features sqlparser/bigdecimal --locked native_backend::tests::frontend_loop -- --ignored

  mysql-reference:
    name: MySQL 8.4 reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: darmok-test
        options: >-
          --health-cmd "mysqladmin ping --silent --host=127.0.0.1"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      MYSQL_PWD: darmok-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Required stock transaction reference observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_transactions.json
          --evidence-dir '${{ runner.temp }}/mysql-transaction-reference'
      - name: Install pinned binary literal reference client
        run: |
          python3 -m venv '${{ runner.temp }}/mysql-binary-client'
          '${{ runner.temp }}/mysql-binary-client/bin/python' -m pip install -r tests/reference/requirements-mysql-binary.txt
      - name: Required stock binary literal field and byte observations
        run: >-
          '${{ runner.temp }}/mysql-binary-client/bin/python' -B tests/reference/observe_mysql_binary_literals.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --port 3306
          --corpus crates/execute/fixtures/mysql-binary-literals.json
          --evidence-dir '${{ runner.temp }}/mysql-binary-literal-reference'
      - name: Preserve binary literal reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-binary-literal-reference
          path: ${{ runner.temp }}/mysql-binary-literal-reference
          if-no-files-found: error
      - name: Required stock local SELECT column observations
        run: >-
          python3 tests/reference/observe_mysql_query_results.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_query_results.json
          --evidence-dir '${{ runner.temp }}/mysql-query-results-reference'
      - name: Required stock typed substring reference observations
        run: >-
          python3 tests/reference/observe_mysql_substrings.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus crates/execute/fixtures/native-substring-mysql84.json
          --evidence-dir '${{ runner.temp }}/mysql-substring-reference'
      - name: Required stock query transaction observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_query_transactions.json
          --evidence-dir '${{ runner.temp }}/mysql-query-transactions-reference'
      - name: Required stock completion-type column observations
        run: >-
          python3 tests/reference/observe_mysql_query_results.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_completion_type_columns.json
          --evidence-dir '${{ runner.temp }}/mysql-completion-type-reference'
      - name: Required stock release lifecycle observations
        run: >-
          python3 -B tests/reference/observe_mysql_frontend_release.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_frontend_release.json
          --evidence-dir '${{ runner.temp }}/mysql-frontend-release-reference'
      - name: Preserve stock release lifecycle receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-frontend-release-reference
          path: ${{ runner.temp }}/mysql-frontend-release-reference
          if-no-files-found: error
      - name: Preserve query transaction reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-query-transactions-reference
          path: |
            ${{ runner.temp }}/mysql-query-transactions-reference
            ${{ runner.temp }}/mysql-completion-type-reference
          if-no-files-found: error
      - name: Preserve SELECT reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-query-results-reference
          path: ${{ runner.temp }}/mysql-query-results-reference
          if-no-files-found: error
      - name: Preserve typed substring reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-substring-reference
          path: ${{ runner.temp }}/mysql-substring-reference
          if-no-files-found: error
      - name: Required stock exact-number observations
        run: >-
          python3 tests/reference/observe_mysql_exact_numbers.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_exact_numbers.json
          --evidence-dir '${{ runner.temp }}/mysql-exact-numbers-reference'
      - name: Preserve exact-number reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-exact-numbers-reference
          path: ${{ runner.temp }}/mysql-exact-numbers-reference
          if-no-files-found: error
      - name: Preserve reference receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-transaction-reference
          path: ${{ runner.temp }}/mysql-transaction-reference
          if-no-files-found: error
      - name: Required stock transaction characteristic observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_transaction_characteristics.json
          --evidence-dir '${{ runner.temp }}/mysql-transaction-characteristics'
      - name: Preserve characteristic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-transaction-characteristics
          path: ${{ runner.temp }}/mysql-transaction-characteristics
          if-no-files-found: error
      - name: Required stock SQL-mode value observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_sql_modes.json
          --evidence-dir '${{ runner.temp }}/mysql-sql-mode-values'
      - name: Preserve SQL-mode value receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-sql-mode-values
          path: ${{ runner.temp }}/mysql-sql-mode-values
          if-no-files-found: error
      - name: Required stock system-variable name observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_system_variable_names.json
          --evidence-dir '${{ runner.temp }}/mysql-system-variable-names'
      - name: Preserve system-variable name receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-system-variable-names
          path: ${{ runner.temp }}/mysql-system-variable-names
          if-no-files-found: error
      - name: Required stock SET execution observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_set_semantics.json
          --evidence-dir '${{ runner.temp }}/mysql-set-semantics'
      - name: Preserve SET execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-set-semantics
          path: ${{ runner.temp }}/mysql-set-semantics
          if-no-files-found: error
      - name: Required stock SET source observations
        run: >-
          python3 tests/reference/observe_mysql_transactions.py
          --container '${{ job.services.mysql.id }}'
          --image mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          --corpus tests/reference/mysql_set_source.json
          --evidence-dir '${{ runner.temp }}/mysql-set-source'
      - name: Preserve SET source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-set-source
          path: ${{ runner.temp }}/mysql-set-source
          if-no-files-found: error
